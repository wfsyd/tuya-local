---
name: Human presence radar sensor
products:
  - id: 2aaelwxk
    model: Human presence sensor
entities:
  - entity: binary_sensor
    class: occupancy
    dps:
      - id: 1
        type: string
        name: sensor
        mapping:
          - dps_val: presence
            value: true
          - value: false
  - entity: sensor
    name: Motion state
    class: enum
    icon: "mdi:motion-sensor"
    dps:
      - id: 101
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: "none"
            value: None
          - dps_val: small_move
            value: Small movement
          - dps_val: large_move
            value: Large movement
  - entity: sensor
    class: illuminance
    dps:
      - id: 106
        type: integer
        optional: true
        name: sensor
        unit: lx
        class: measurement
  - entity: number
    name: Sensitivity
    category: config
    icon: "mdi:motion-sensor"
    dps:
      - id: 2
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 10
  - entity: number
    name: Minimum distance
    category: config
    class: distance
    dps:
      - id: 3
        type: integer
        optional: true
        name: value
        unit: m
        range:
          min: 0
          max: 1000
        mapping:
          - scale: 100
  - entity: number
    name: Maximum distance
    category: config
    class: distance
    dps:
      - id: 4
        type: integer
        optional: true
        name: value
        unit: m
        range:
          min: 0
          max: 1000
        mapping:
          - scale: 100
  - entity: number
    name: Presence keep time
    category: config
    class: duration
    icon: "mdi:timer-outline"
    dps:
      - id: 102
        type: integer
        optional: true
        name: value
        unit: s
        range:
          min: 0
          max: 28800
  - entity: number
    name: Static maximum distance
    category: config
    class: distance
    dps:
      - id: 104
        type: integer
        optional: true
        name: value
        unit: m
        range:
          min: 0
          max: 600
        mapping:
          - scale: 100
  - entity: number
    name: Static sensitivity
    category: config
    icon: "mdi:motion-sensor"
    dps:
      - id: 105
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 10
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 107
        type: boolean
        optional: true
        name: switch
